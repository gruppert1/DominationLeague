<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domination League | Matchups</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <h1 class="league-title">Domination League</h1>
      <p class="league-subtitle">Matchups Tab</p>
      <nav class="tab-nav" aria-label="Main tabs">
        <a class="tab-link" href="index.html">Home</a>
        <a class="tab-link active" href="matchups.html">Matchups</a>
        <a class="tab-link" href="team-stats.html">Team Stats</a>
        <a class="tab-link" href="blog.html">Blog</a>
        <a class="tab-link" href="members.html">Members</a>
      </nav>
    </header>

    <main class="main-content">
      <section class="panel">
        <h2>Weekly Matchups</h2>
        <p class="lead">Current-week head-to-head matchups with projections, live points, and member-vote win percentages.</p>
        <div class="filters-row" aria-label="Matchup filters">
          <label class="filter-control">
            <span>Week</span>
            <select id="matchups-week-filter"></select>
          </label>
        </div>
        <p id="matchups-status" class="footer-note">Loading current week matchups...</p>
      </section>

      <section id="matchups-grid" class="matchups-grid" aria-live="polite"></section>
    </main>
  </div>

  <script src="matchups.js"></script>
</body>
</html>

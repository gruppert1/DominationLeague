<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domination League | Team Stats</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <h1 class="league-title">Domination League</h1>
      <p class="league-subtitle">Team Stats Tab</p>
      <nav class="tab-nav" aria-label="Main tabs">
        <a class="tab-link" href="index.html">Home</a>
        <a class="tab-link" href="matchups.html">Matchups</a>
        <a class="tab-link active" href="team-stats.html">Team Stats</a>
        <a class="tab-link" href="forums.html">Forums</a>
        <a class="tab-link" href="members.html">Members</a>
      </nav>
    </header>

    <main class="main-content">
      <section class="panel">
        <h2>Team Performance Board</h2>
        <p class="lead">Current standings with league record, division record, and points tiebreaker.</p>
        <p id="team-stats-status" class="footer-note">Loading team stats...</p>

        <table class="placeholder-table" aria-label="Team stats">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Manager</th>
              <th>Division</th>
              <th>League Record</th>
              <th>Division Record</th>
              <th>PF</th>
              <th>PA</th>
            </tr>
          </thead>
          <tbody id="team-stats-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="team-stats.js"></script>
</body>
</html>
